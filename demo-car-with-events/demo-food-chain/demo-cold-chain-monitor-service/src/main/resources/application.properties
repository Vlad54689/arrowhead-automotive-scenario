############################################
###       CUSTOM PARAMETERS              ###
############################################

# Name of the client system (origin link of the food cold-chain)
application_system_name=coldchainmonitor

# Client web-server parameters.
# ColdChain is a PUBLISHER and the POST entrypoint. It runs on the HOST (like the automotive
# quality-inspection publisher) and only makes OUTBOUND calls to the core (Service Registry,
# Event Handler) on 127.0.0.1; it never receives an inbound /notify, so 127.0.0.1 is fine.
server.address=127.0.0.1
server.port=9897

# Service Registry Core System web-server parameters.
# Only the Service Registry is configured here; the Authorization, Orchestrator and Event Handler
# URIs are discovered through the Service Registry at runtime.
#   Service Registry : 127.0.0.1:8443   (Docker core, exposed port)
#   Event Handler    : discovered via SR
sr_address=127.0.0.1
sr_port=8443

############################################
###           SECURE MODE                ###
############################################

# Set this to false to disable https mode
server.ssl.enabled=false
# Set this to false to deactivate the token security filter
token.security.filter.enabled=false

# Keystore configuration - required only when server.ssl.enabled=true (Phase B / secure).
