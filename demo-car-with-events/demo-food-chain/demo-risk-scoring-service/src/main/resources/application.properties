############################################
###       CUSTOM PARAMETERS              ###
############################################

# Name of the client system (middle link of the food cold-chain)
application_system_name=riskscoring

# Client web-server parameters.
# RiskScoring is a SUBSCRIBER (must receive /notify from the Event Handler) AND a PUBLISHER. Like
# the automotive maintenance subscriber, it runs as a CONTAINER sharing the core container's network
# namespace (network_mode: container:arrowhead_core). Inside that shared namespace it binds and
# advertises 127.0.0.1: the Event Handler (same namespace) reaches /notify on 127.0.0.1:9898, and
# outbound publish to the Event Handler also goes to 127.0.0.1.
server.address=127.0.0.1
server.port=9898

# Service Registry Core System web-server parameters (reached on 127.0.0.1 inside the shared namespace).
#   Service Registry : 127.0.0.1:8443
#   Event Handler    : discovered via SR
sr_address=127.0.0.1
sr_port=8443

############################################
###           EVENT HANDLING             ###
############################################

# event type -> notification uri (under the /notify base). Dotted event type in bracket notation so
# the dots stay part of the map key. The Event Handler POSTs the EventDTO to /notify/coldchainreadingcreated.
event.eventTypeURIMap[coldchain.reading.created]=coldchainreadingcreated

############################################
###           SECURE MODE                ###
############################################

# Set this to false to disable https mode
server.ssl.enabled=false
# Set this to false to deactivate the token security filter
token.security.filter.enabled=false

