############################################
###       CUSTOM PARAMETERS              ###
############################################

# Name of the client system (final link of the food cold-chain)
application_system_name=supplychaintrust

# Client web-server parameters.
# SupplyChainTrust is a SUBSCRIBER and must receive /notify from the Event Handler. Like the
# automotive maintenance subscriber, it runs as a CONTAINER sharing the core container's network
# namespace (network_mode: container:arrowhead_core), binding and advertising 127.0.0.1 so the
# Event Handler (same namespace) reaches /notify on 127.0.0.1:9899.
server.address=127.0.0.1
server.port=9899

# Service Registry Core System web-server parameters (reached on 127.0.0.1 inside the shared namespace).
#   Service Registry : 127.0.0.1:8443
#   Event Handler    : discovered via SR
sr_address=127.0.0.1
sr_port=8443

############################################
###           EVENT HANDLING             ###
############################################

# event type -> notification uri (under the /notify base). The Event Handler POSTs the EventDTO to
# /notify/riskassessed.
event.eventTypeURIMap[risk.assessed]=riskassessed

############################################
###           SECURE MODE                ###
############################################

# Set this to false to disable https mode
server.ssl.enabled=false
# Set this to false to deactivate the token security filter
token.security.filter.enabled=false

# Keystore configuration - required only when server.ssl.enabled=true (Phase B / secure).
