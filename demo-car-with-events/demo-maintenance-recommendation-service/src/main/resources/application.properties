############################################
###       CUSTOM PARAMETERS              ###
############################################

# Name of the client system
application_system_name=maintenancerecommendation

# Client web-server parameters.
# This service runs on the host while the Arrowhead core runs in Docker. The Event Handler
# (inside the arrowhead_core container) must POST notifications back to this /notify endpoint,
# so we bind to AND advertise the Docker bridge gateway IP (the host as seen from the container)
# instead of 127.0.0.1 (which, inside the container, is the container's own loopback).
# 172.18.0.1 is the gateway of the `sos-arrowhead-automotive_default` compose network.
server.address=172.18.0.1
server.port=9896

# Service Registry Core System web-server parameters.
# Only the Service Registry is configured here; the Event Handler (and Authorization, when secure)
# URIs are discovered through the Service Registry at runtime.
#
# Docker deployment - core systems run on hostname `arrowhead_core`:
#   Service Registry : arrowhead_core:8443
#   Authorization    : arrowhead_core:8445
#   Orchestrator     : arrowhead_core:8441
#   Event Handler    : arrowhead_core:8455
# When running locally with mvn, use localhost (127.0.0.1) for these instead
# (Java's URI parser rejects the underscore in `arrowhead_core`).
sr_address=127.0.0.1
sr_port=8443

############################################
###           EVENT HANDLING             ###
############################################

# configure event type -> notification uri (under the /notify base).
# The dotted event type is written in bracket notation so the dots stay part of the map key.
# The Event Handler will POST the EventDTO to /notify/qualityinspectioncreated on this system.
event.eventTypeURIMap[quality.inspection.created]=qualityinspectioncreated

############################################
###           SECURE MODE                ###
############################################

# configure secure mode

# Set this to false to disable https mode
server.ssl.enabled=false
# Set this to false to deactivate the token security filter
token.security.filter.enabled=false

# Keystore configuration - required only when server.ssl.enabled=true.
# Provide a `maintenancerecommendation.p12` (and `truststore.p12`) under
# src/main/resources/certificates before enabling secure mode.
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:certificates/maintenancerecommendation.p12
#server.ssl.key-store-password=123456
#server.ssl.key-alias=maintenancerecommendation
#server.ssl.key-password=123456
#server.ssl.client-auth=need
#server.ssl.trust-store-type=PKCS12
#server.ssl.trust-store=classpath:certificates/truststore.p12
#server.ssl.trust-store-password=123456
