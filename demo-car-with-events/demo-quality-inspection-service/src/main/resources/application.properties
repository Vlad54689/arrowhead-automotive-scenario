############################################
###       CUSTOM PARAMETERS              ###
############################################

# Name of the client system
application_system_name=qualityinspection

# Client web-server parameters
server.address=127.0.0.1
server.port=9895

# Service Registry Core System web-server parameters.
# Only the Service Registry is configured here; the Authorization, Orchestrator and
# Event Handler URIs are discovered through the Service Registry at runtime.
#
# This service is run on the host with mvn while the core systems run in Docker with
# exposed ports, so the active address is 127.0.0.1. The Docker hostname `arrowhead_core`
# cannot be used here: Java's URI parser rejects the underscore in the hostname.
#
# Docker deployment - core systems run on hostname `arrowhead_core`:
#   Service Registry : arrowhead_core:8443
#   Authorization    : arrowhead_core:8445
#   Orchestrator     : arrowhead_core:8441
#   Event Handler    : arrowhead_core:8455
sr_address=127.0.0.1
sr_port=8443

# Service limit of provider (shut down after the given number of requests)
service_limit=200

############################################
###           SECURE MODE                ###
############################################

# configure secure mode

# Set this to false to disable https mode
server.ssl.enabled=false
# Set this to false to deactivate the token security filter
token.security.filter.enabled=false

# Keystore configuration - required only when server.ssl.enabled=true.
# Provide a `qualityinspection.p12` (and `truststore.p12`) under src/main/resources/certificates
# before enabling secure mode.
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:certificates/qualityinspection.p12
#server.ssl.key-store-password=123456
#server.ssl.key-alias=qualityinspection
#server.ssl.key-password=123456
#server.ssl.client-auth=need
#server.ssl.trust-store-type=PKCS12
#server.ssl.trust-store=classpath:certificates/truststore.p12
#server.ssl.trust-store-password=123456
